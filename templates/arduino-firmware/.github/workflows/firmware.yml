# Copy to .github/workflows/ of your firmware repository and set SKETCH.
# Builds the .bin on every push, checks it against ESPidi HUB, attaches it to v* releases.
name: firmware

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  SKETCH: ESPidiTemplate   # folder that holds <SKETCH>.ino
  ARDUINO_ESP32_URL: https://espressif.github.io/arduino-esp32/package_esp32_index.json

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ESPidi HUB SDK and checker
        uses: actions/checkout@v4
        with:
          repository: Cirocular-Vlasenko-Daniil/ESPidi-HUB
          path: .espidi-hub

      - uses: arduino/setup-arduino-cli@v2

      - name: ESP32 core and libraries
        run: |
          arduino-cli core update-index --additional-urls "$ARDUINO_ESP32_URL"
          arduino-cli core install esp32:esp32 --additional-urls "$ARDUINO_ESP32_URL"
          arduino-cli lib install "Adafruit SSD1306" "Adafruit GFX Library"

      # huge_app only lifts Arduino's own 1.25 MB limit; the real limit is the HUB slot.
      - name: Build
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32c3:PartitionScheme=huge_app --warnings all \
            --library .espidi-hub/sdk/ESPidiHub --output-dir out "$SKETCH"

      - name: Check against ESPidi HUB
        run: python3 .espidi-hub/tools/espidi_hub.py check --require-descriptor "out/$SKETCH.ino.bin"

      - name: Collect
        run: cp "out/$SKETCH.ino.bin" "$SKETCH.bin"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SKETCH }}
          path: ${{ env.SKETCH }}.bin

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.SKETCH }}.bin
